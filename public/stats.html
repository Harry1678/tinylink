<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Link Stats</title>
</head>
<body>

<h1>TinyLink — Stats</h1>

<div id="stats"></div>

<script>
// Read ?code=XYZ
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

async function loadStats() {
    const res = await fetch(`http://localhost:3000/api/links/${code}`);
    const data = await res.json();

    document.getElementById("stats").innerHTML = `
        <p><b>Short Code:</b> ${data.code}</p>
        <p><b>Original URL:</b> ${data.target_url}</p>
        <p><b>Total Clicks:</b> ${data.clicks}</p>
        <p><b>Last Clicked:</b> ${data.last_clicked ? data.last_clicked : "Never"}</p>
        <button onclick="window.location='index.html'">Back</button>
    `;
}

loadStats();
</script>

</body>
</html>
