<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TinyLink — Stats</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>

<h1>Link Statistics</h1>

<div class="wrapper">

    <div class="card">
        <h2>Link Details</h2>

        <div id="stats" style="font-size:18px;"></div>

        <button style="margin-top:20px;" onclick="window.location='index.html'">
            Back to Dashboard
        </button>
    </div>

</div>

<footer>
    © 2025 TinyLink — Made with ❤️
</footer>

<script>
const BASE_URL = "https://tinylink-77ax.onrender.com";

// Get ?code=abc123 from URL
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

async function loadStats() {
    const res = await fetch(`${BASE_URL}/api/links/${code}`);
    const data = await res.json();

    document.getElementById("stats").innerHTML = `
        <p><strong>Short Code:</strong> ${data.code}</p>
        <p><strong>Original URL:</strong> 
            <a href="${data.target_url}" target="_blank">${data.target_url}</a>
        </p>
        <p><strong>Total Clicks:</strong> ${data.clicks}</p>
        <p><strong>Last Clicked:</strong> ${data.last_clicked || "Never"}</p>
    `;
}

loadStats();
</script>

</body>
</html>
