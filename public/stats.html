<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TinyLink Stats</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Link Statistics</h1>

<div class="wrapper">
    <div class="card">
        <div id="stats"></div>
        <button onclick="window.location='index.html'">Back</button>
    </div>
</div>

<script>
const BASE_URL = "https://tinylink-77ax.onrender.com";
const params = new URLSearchParams(window.location.search);
const code = params.get("code");

async function loadStats() {
    const res = await fetch(`${BASE_URL}/api/links/${code}`);
    const data = await res.json();

    document.getElementById("stats").innerHTML = `
        <p><b>Short Code:</b> ${data.code}</p>
        <p><b>Original URL:</b> ${data.target_url}</p>
        <p><b>Total Clicks:</b> ${data.clicks}</p>
        <p><b>Last Clicked:</b> ${data.last_clicked || "Never"}</p>
    `;
}

loadStats();
</script>

</body>
</html>
