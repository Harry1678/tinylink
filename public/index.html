<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TinyLink Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>TinyLink Dashboard</h1>

<h3>Create a Short Link</h3>
<input id="url" type="text" placeholder="Enter long URL">
<input id="customCode" type="text" placeholder="Optional custom code (6-8 chars)">
<button onclick="createLink()">Create</button>

<p id="result"></p>

<h2>Your Links</h2>
<table id="linksTable" border="1" style="width:600px;">
    <tr>
        <th>Code</th>
        <th>URL</th>
        <th>Clicks</th>
        <th>Actions</th>
    </tr>
</table>

<script>
const BASE_URL = "https://tinylink-77ax.onrender.com";

// Fetch and display all links
async function fetchLinks() {
    const res = await fetch(`${BASE_URL}/api/links`);
    const data = await res.json();
    const table = document.getElementById("linksTable");

    // Clear old rows except header
    table.innerHTML = `
        <tr>
            <th>Code</th>
            <th>URL</th>
            <th>Clicks</th>
            <th>Actions</th>
        </tr>
    `;

    data.forEach(link => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${link.code}</td>
            <td><a href="${BASE_URL}/${link.code}" target="_blank">${link.target_url}</a></td>
            <td>${link.clicks}</td>
            <td>
                <a href="${BASE_URL}/${link.code}" target="_blank">Open</a> |
                <a href="stats.html?code=${link.code}">Stats</a> |
                <button onclick="deleteLink('${link.code}')">Delete</button>
            </td>
        `;
        table.appendChild(row);
    });
}

// Create a new short link
async function createLink() {
    const target_url = document.getElementById('url').value;
    const custom_code = document.getElementById('customCode').value.trim();

    const response = await fetch(`${BASE_URL}/api/links`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target_url, custom_code: custom_code || undefined })
    });

    const data = await response.json();
    document.getElementById("result").innerText = JSON.stringify(data, null, 2);
    fetchLinks(); // Refresh table
}

// Delete a link
async function deleteLink(code) {
    await fetch(`${BASE_URL}/api/links/${code}`, { method: "DELETE" });
    fetchLinks();
}

// Load links on page load
fetchLinks();
</script>

</body>
</html>
